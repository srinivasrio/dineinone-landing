<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Redirecting to Log In — Dine in One</title>
  <meta http-equiv="refresh" content="0; url=https://app.dineinone.com/login">
  <link rel="icon" type="image/png" href="/favicon.png">
  <script>
    window.location.replace("https://app.dineinone.com/login" + window.location.search);
  </script>
  <style>
    body {
      background: #FBF9F7;
      color: #222125;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #FFFFFF;
      border: 1px solid #EFE9E3;
      border-radius: 20px;
      padding: 32px 24px;
      max-width: 400px;
      box-shadow: 0 10px 30px rgba(34,33,37,0.06);
    }
    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid #EFE9E3;
      border-top-color: #C2412D;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { font-size: 19px; margin-bottom: 8px; }
    p { font-size: 13.5px; color: #5E5A60; margin-bottom: 18px; }
    a { color: #C2412D; font-weight: 600; text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <h2>Redirecting to Log In</h2>
    <p>Connecting to Dine in One secure login portal...</p>
    <a href="https://app.dineinone.com/login">Click here if you are not redirected automatically</a>
  </div>
</body>
</html>
